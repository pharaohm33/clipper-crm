<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clipper CRM</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--acc:#e11d48;--ok:#16a34a;--hd:#111827}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f17;--card:#141a26;--ink:#e5e7eb;--mut:#94a3b8;--line:#243044;--hd:#1e293b}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--hd);color:#fff;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header b{font-size:16px}nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:#cbd5e1;padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:var(--acc);color:#fff}
main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat small{color:var(--mut);display:block}.stat b{font-size:22px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase}
.tw{overflow-x:auto}
input,select,textarea,button.b{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{width:100%;min-height:90px}button.b{cursor:pointer}button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}label{color:var(--mut);font-size:12px;display:block}
a{color:var(--acc)}.hide{display:none}.mut{color:var(--mut)}pre{white-space:pre-wrap;max-height:200px;overflow:auto;background:var(--bg);padding:8px;border-radius:6px}
.dm{max-width:420px;white-space:pre-wrap;font-size:12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}.ov .card{width:min(600px,100%);max-height:92vh;overflow:auto;margin:0}.ov label{margin-top:8px}.ov input,.ov textarea{width:100%}
.grip{cursor:grab;color:var(--mut);font-size:16px;padding:0 4px;user-select:none}.grip:active{cursor:grabbing}nav button.drop{outline:2px dashed #fff;background:var(--acc)}
.sh{display:flex;gap:2px;align-items:flex-end;height:60px}.sh div{flex:1;background:var(--acc);border-radius:3px 3px 0 0;min-height:2px}
</style>
</head>
<body>
<header><b>Clipper CRM</b>
<nav id="nav"></nav>
<span id="cp" style="margin-left:auto" class="mut"></span><span class="mut" id="sync"></span><span class="mut" id="clock"></span></header>
<main id="main"></main>
<div id="ov" class="hide"></div>
<script>
const TIERS=[{n:'Starter',clips:20,fee:300},{n:'Growth',clips:50,fee:500},{n:'Scale',clips:120,fee:1000}];
const CNS='Contacted - no sample sent';
const STATUSES=['New','Sample Sent',CNS,'Replied','Interested','Client','No Response','Not Interested','Removed'];
const TPL=['{n} podcast full episode','{n} podcast interview','how to start a {n} podcast','{n} podcast new episode'];
const DEF={settings:{key:'',goal:5000,daily:100,minSubs:1000,maxSubs:150000,maxDays:60,followDays:3,templates:3,
 syncUrl:'',syncPw:'',geminiKey:'',geminiModel:'gemini-2.5-flash',skipNoContact:1,igOnly:0,useGeminiParse:0,maxShorts:20,emailLimit:20,
 emailSkipMS:true,emailSubjectB:"{name} clip you can post",emailBodyB:"",emailSubject:"made a clip from your {name} episode",
 emailBody:"{Hi|Hey|Hello} there,\n\n{I just watched|I caught|I watched} your recent episode on {niche} and {loved it|really enjoyed it}.\n\n{personal_line}\n\nI cut {clips} from it that I think could do well on Reels, TikTok and Shorts:\n\n{clip_link}\n\n{they_are} yours to post, free, no strings attached. If you'd like a few of these each week, just reply and I'll send you more.\n\n{Thanks|Best|Cheers},\n{sender}",
 dm:"{Hey|Hey there|Hi}! {Just watched|Just finished|Caught} your {latest|recent|newest} episode on {niche} and {loved it|really enjoyed it|thought it was great}. I {made|cut|put together} a quick clip from it because {it deserved more eyes|it was too good not to share|I think it could do well on Reels}. {Totally free|No strings attached|No cost at all}, just thought you'd like to see it. Here's the full episode I pulled it from: {episode}"},
 niches:['real estate','personal finance','fitness','entrepreneurship','mental health','true crime','faith christian','sports betting','parenting','health longevity'],
 leads:[],payments:[],clients:[],team:[],retainers:[]};
let S;try{S=JSON.parse(localStorage.getItem('clipperCRM'))}catch(e){}
S=Object.assign({},DEF,S||{});S.settings=Object.assign({},DEF.settings,S.settings);
if(S.settings.emailSubject==="{Quick clip|Short clip|Clip} from your {niche} episode"){S.settings.emailSubject=DEF.settings.emailSubject;if(!S.settings.emailSubjectB)S.settings.emailSubjectB=DEF.settings.emailSubjectB}
if(S.settings.emailBody==="{Hi|Hey|Hello} there,\n\n{I just watched|I caught|I watched} your recent episode on {niche} and {loved it|really enjoyed it}.\n\n{personal_line}\n\nI cut a short clip from it that I think could do well on Reels, TikTok and Shorts:\n\n{clip_link}\n\n{It is yours to post, free, no strings attached.|Feel free to post it, it is yours, no strings attached.} If you'd like a few of these each week, just reply and I'll send you more.\n\n{Thanks|Best|Cheers},\n{sender}")S.settings.emailBody=DEF.settings.emailBody;
if(S.settings.emailBody==="{Hi|Hey|Hello} there,\n\n{I just watched|I caught|I watched} your recent episode on {niche} and {loved it|really enjoyed it}. I cut a short clip from it that I think could do well on Reels, TikTok and Shorts:\n\n{clip_link}\n\n{It is yours to post, free, no strings attached.|Feel free to post it, it is yours, no strings attached.} If you'd like a few of these each week, just reply and I'll send you more.\n\n{Thanks|Best|Cheers},\n{sender}")S.settings.emailBody=DEF.settings.emailBody;
if(/[—–]/.test(S.settings.dm)||S.settings.dm.startsWith('Hey! Just watched your latest'))S.settings.dm=DEF.settings.dm;
let syncT,syncMsg='';
function setSync(m){syncMsg=m;const e=document.getElementById('sync');if(e)e.textContent=m}
function save(){localStorage.setItem('clipperCRM',JSON.stringify(S));clearTimeout(syncT);if(S.settings.syncUrl&&S.settings.syncPw)syncT=setTimeout(()=>syncCall('push'),2500)}
async function syncCall(action){const g=S.settings;if(!g.syncUrl||!g.syncPw){setSync('Sync not set up');return null}
 setSync(action=='push'?'Syncing…':'Pulling…');
 const st={leads:S.leads,payments:S.payments,team:S.team,clients:S.clients,retainers:S.retainers||[],settings:{goal:g.goal,daily:g.daily}};
 try{const r=await fetch(g.syncUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({secret:g.syncPw,action,state:action=='push'?st:undefined})});
  const j=await r.json();if(!j.ok)throw new Error(j.error);setSync(action=='push'?'Synced ✓ '+new Date().toLocaleTimeString():'Pulled ✓');return j}
 catch(e){setSync('Sync failed: '+e.message);return null}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>{const x=d||new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>iso();const money=n=>'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});
const addDays=(d,n)=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()+n);return iso(x)};
const monthKey=()=>today().slice(0,7);
let tab='dash';const TABS=[['dash','Dashboard'],['today','Today'],['leads','Leads'],['email','Email'],['find','Find Podcasts'],['money','Money'],['settings','Settings']];
function nav(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" data-t="${k}">${l}</button>`).join('')}
$('#nav').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}};
$('#nav').ondragover=e=>{if(e.target.dataset&&e.target.dataset.t==='today'){e.preventDefault();e.dataTransfer.dropEffect='move';e.target.classList.add('drop')}};
$('#nav').ondragleave=e=>{if(e.target.classList)e.target.classList.remove('drop')};
$('#nav').ondrop=e=>{if(!(e.target.dataset&&e.target.dataset.t==='today'))return;e.preventDefault();const t=(e.dataTransfer.getData('text/plain')||'');if(t.startsWith('lead:'))pinLead(t.slice(5));else render()};
function spin(t,seed){let h=0;for(const ch of seed)h=(Math.imul(31,h)+ch.charCodeAt(0))|0;
 const r=()=>{h=(h+0x6D2B79F5)|0;let x=Math.imul(h^(h>>>15),1|h);x=(x+Math.imul(x^(x>>>7),61|x))^x;return((x^(x>>>14))>>>0)/4294967296};
 const re=/\{([^{}]*\|[^{}]*)\}/;let p;while((p=re.exec(t))){const o=p[1].split('|');t=t.replace(re,()=>o[Math.floor(r()*o.length)])}return t}
function dm(l){let t=spin(S.settings.dm,l.id+':'+(l.spin||0));t=t.replace(/\s*[—–]\s*/g,', ').replace(/-/g,' ');
 return t.replace(/\{name\}/g,l.name).replace(/\{niche\}/g,String(l.niche||'').replace(/-/g,' ')).replace(/\{episode\}/g,l.episode)}
const sentOn=d=>S.leads.filter(l=>l.sent===d).length;
function stats(){
 const m=monthKey(),earned=S.payments.filter(p=>p.date.startsWith(m)).reduce((a,p)=>a+p.amount,0);
 const owed=S.team.filter(t=>t.date.startsWith(m)).reduce((a,t)=>a+t.clips*t.rate,0);
 const now=new Date(),dl=new Date(now.getFullYear(),now.getMonth()+1,0).getDate()-now.getDate()+1;
 const sentAll=S.leads.filter(l=>l.sent).length,rep=S.leads.filter(l=>['Replied','Interested','Client'].includes(l.status)).length,cl=S.leads.filter(l=>l.status=='Client').length;
 return{earned,owed,dl,remaining:Math.max(0,S.settings.goal-earned),sentToday:sentOn(today()),sentAll,rep,cl,
  fresh:S.leads.filter(l=>l.status=='New').length,fu:S.leads.filter(l=>l.status=='Sample Sent'&&l.follow&&l.follow<=today()).length,...mrrStats()}}
function mrrStats(){const act=(S.retainers||[]).filter(r=>r.status=='Active'),mrr=act.reduce((a,r)=>a+(+r.fee||0),0);return{mrr,act:act.length,clipsM:act.reduce((a,r)=>a+(+r.clips||0),0),avgFee:act.length?mrr/act.length:0}}
function render(){nav();({dash,today:todayV,leads,email:emailV,find,money:moneyV,settings})[tab]()}
function dash(){const s=stats(),g=S.settings;const pct=Math.min(100,s.earned/g.goal*100);
 const days=[...Array(14)].map((_,i)=>{const d=iso(new Date(Date.now()-(13-i)*864e5));return[d,sentOn(d)]});const mx=Math.max(g.daily,...days.map(x=>x[1]));
 const byInf={};S.payments.forEach(p=>{(byInf[p.who]=byInf[p.who]||{all:0,mo:0}).all+=p.amount;if(p.date.startsWith(monthKey()))byInf[p.who].mo+=p.amount});
 $('#main').innerHTML=`<div class="card"><b>${money(s.earned)}</b> of ${money(g.goal)} this month<div class="bar"><i style="width:${pct}%"></i></div>
 <span class="mut">Need ${money(s.remaining/s.dl)}/day for ${s.dl} more days · Profit after team pay: ${money(s.earned-s.owed)}</span></div>
 <div class="card" style="border-color:var(--ok)"><b>${money(s.mrr)}</b> monthly recurring revenue (MRR) · ${s.act} active retainer${s.act==1?'':'s'} · ${s.clipsM} clips/month<div class="bar"><i style="width:${Math.min(100,s.mrr/g.goal*100)}%"></i></div>
 <span class="mut">${s.mrr>=g.goal?'Your retainers cover the monthly goal.':`Need ${money(g.goal-s.mrr)} more MRR, about ${Math.ceil((g.goal-s.mrr)/(s.avgFee||500))} more clients at ${money(s.avgFee||500)}${s.avgFee?' (your average)':''}.`}</span></div>
 <div class="grid">
 <div class="stat"><small>DMs today</small><b>${s.sentToday}/${g.daily}</b><div class="bar"><i style="width:${Math.min(100,s.sentToday/g.daily*100)}%;background:var(--acc)"></i></div></div>
 <div class="stat"><small>Fresh leads</small><b>${s.fresh}</b></div><div class="stat"><small>Follow-ups due</small><b>${s.fu}</b></div>
 <div class="stat"><small>Samples sent (all)</small><b>${s.sentAll}</b></div>
 <div class="stat"><small>Reply rate</small><b>${s.sentAll?(s.rep/s.sentAll*100).toFixed(1):0}%</b></div>
 <div class="stat"><small>Clients won</small><b>${s.cl}</b></div><div class="stat"><small>Contacted, no sample</small><b>${S.leads.filter(l=>l.status==CNS).length}</b></div></div><br>
 <div class="card"><b>Last 14 days outreach</b><div class="sh">${days.map(([d,n])=>`<div title="${d}: ${n}" style="height:${n/mx*100}%"></div>`).join('')}</div></div>
 <div class="card"><b>Earnings per influencer</b><div class="tw"><table><tr><th>Influencer</th><th>All-time</th><th>This month</th></tr>
 ${Object.entries(byInf).sort((a,b)=>b[1].all-a[1].all).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${money(v.all)}</td><td>${money(v.mo)}</td></tr>`).join('')||'<tr><td colspan=3 class=mut>No payments yet — log them on the Money tab.</td></tr>'}</table></div></div>`}
function todayV(){const want=Math.max(1,S.settings.daily-sentOn(today()));
 const list=S.leads.filter(l=>l.status=='New'&&(l.pin||(S.settings.igOnly?l.ig:(l.ig||l.x||l.tt)))).sort((a,b)=>(b.pin||0)-(a.pin||0)||(b.clipFile?1:0)-(a.clipFile?1:0)||(a.ig?0:1)-(b.ig?0:1)||(a.shortsPct??50)-(b.shortsPct??50)||(a.subs||0)-(b.subs||0)).slice(0,want);
 const skip=todayV.skip=todayV.skip||new Set(),sko=todayV.skipOrder=todayV.skipOrder||[],q=list.filter(l=>!skip.has(l.id));
 // The lead you are working on stays put through redraws (a sync, an edit, switching tabs) until YOU move on.
 const cur=(todayV.cur&&S.leads.find(x=>x.id==todayV.cur&&x.status=='New'&&!skip.has(x.id)))||q[0];todayV.cur=cur?cur.id:null;
 const ctUrl=l=>l.ig||l.x||l.tt||l.web;
 $('#main').innerHTML=`<div class="card"><b>${sentOn(today())}/${S.settings.daily}</b> sent today · ${list.length} fresh leads queued. <button class="b" data-prep="1" ${ES.busy?'disabled':''} title="For the next 5 leads: downloads a slice of their episode, makes one clip with your template settings, and puts it on a shareable link. Needs the helper running.">⚙ Prepare clips for the next 5</button>${ES.busy?` <span class=mut>working: ${esc((ES.lines.filter(t=>!/^[A-Z]+ /.test(t)).slice(-1)[0]||'starting...').slice(0,80))}</span>`:''}${(S.undo||[]).length?` <button class="b" data-undo="1" title="Puts the last lead you marked as sent back where it was">↩ Undo sent: ${esc((S.leads.find(x=>x.id==S.undo[S.undo.length-1].id)||{}).name||'last lead')}</button>`:''}${sko.length?` <button class="b" data-back="1">◀ Back to ${esc((S.leads.find(x=>x.id==sko[sko.length-1])||{}).name||'last skipped')} (${sko.length} skipped)</button>`:''} Open the profile, paste the DM, attach your clip, send.</div>
 ${cur?`<div class="card" style="border-color:var(--acc)"><b>Next up: ${esc(cur.name)}</b> <span class=mut>${(cur.subs||0).toLocaleString()} subs · ${cur.ig?'Instagram':cur.x?'X':cur.tt?'TikTok':'link'}</span>
 ${cur.epTitle?`<div class=mut>Episode: ${esc(cur.epTitle)}</div>`:''}${cur.clipFile?`<div class=mut>🎬 Clip ready${cur.clipTitle?': '+esc(cur.clipTitle):''} <button class="b" data-revealclip="${cur.id}">Show clip file</button>${cur.clipLink?` <button class="b" data-cplink="${cur.id}">Copy clip link</button>`:''}</div>`:(cur.clipFail?`<div class=mut>Clip could not be made: ${esc(cur.clipFail)}</div>`:'')}${cur.notes&&/Clip idea/.test(cur.notes)?`<div class=mut>${esc(cur.notes.split(' | ').filter(x=>/Clip idea/.test(x))[0])}</div>`:''}<p class="dm" style="max-width:none">${esc(dm(cur))}</p>
 <div class="row"><button class="b p" data-open="${cur.id}">Open profile + copy DM</button>
 ${cur.ig&&cur.x?`<button class="b" data-openu="${esc(cur.x)}" data-id="${cur.id}">Open X + copy</button>`:''}${cur.ig&&cur.tt?`<button class="b" data-openu="${esc(cur.tt)}" data-id="${cur.id}">Open TikTok + copy</button>`:''}<button class="b" data-ep="${cur.id}">Open episode</button><button class="b" data-next="${cur.id}">Sent, next</button><button class="b" data-cns="${cur.id}" title="You reached out but did not send a sample (for example an inactive podcast that looks like a real business)">Contacted, no sample</button><button class="b" data-shuf="${cur.id}">Reshuffle DM</button><button class="b" data-skip="${cur.id}">Skip</button><button class="b p" data-gc="${cur.id}">Send clip range to clipper</button>${cur.sampleFile?`<button class="b" data-reveal="${cur.id}" title="${esc(cur.sampleFile)}">Show sample file</button>`:''}<button class="b" data-edc="${cur.id}">Edit contact</button><button class="b" data-ede="${cur.id}">Edit episode</button><button class="b" data-rm="${cur.id}" title="Remove for good, never added back">Remove</button></div>
 <span class=mut>Opens in a new tab. If you're logged into Instagram there, it lands on their profile. Hit Message, paste, attach the clip.</span></div>`:''}
 <div class="card tw"><table><tr><th>Sent</th><th>Podcast</th><th>Contact</th><th>Episode</th><th>DM</th></tr>
 ${list.map(l=>`<tr><td><input type="checkbox" data-sent="${l.id}"> <button class="b" data-ed="${l.id}" title="Edit links">✎</button><button class="b" data-rm="${l.id}" title="Remove for good">✕</button></td><td>${esc(l.name)}<br><span class=mut>${(l.subs||0).toLocaleString()} subs${l.shortsPct!=null?` · ${l.shortsPct}% Shorts`:''}</span></td>
 <td>${[l.ig&&`<a target=_blank rel=noopener href="${esc(l.ig)}">Instagram</a>`,l.x&&`<a target=_blank rel=noopener href="${esc(l.x)}">X</a>`,l.tt&&`<a target=_blank rel=noopener href="${esc(l.tt)}">TikTok</a>`,l.web&&`<a target=_blank rel=noopener href="${esc(l.web)}">Link</a>`].filter(Boolean).join(' · ')}</td>
 <td>${l.episode?`<a target=_blank rel=noopener href="${esc(l.episode)}">${esc((l.epTitle||'Episode').slice(0,45))}</a>`:'<span class=mut>none</span>'}</td><td class="dm">${esc(dm(l))}<br><button class="b" data-copy="${l.id}">Copy DM</button></td></tr>`).join('')||'<tr><td colspan=5 class=mut>No fresh leads with an Instagram. Use Find Podcasts, or Leads → Find missing Instagrams.</td></tr>'}</table></div>`;
 $('#main').onclick=e=>{const d=e.target.dataset,get=id=>S.leads.find(x=>x.id==id);
  if(d.copy){navigator.clipboard.writeText(dm(get(d.copy)));e.target.textContent='Copied ✓'}
  if(d.open){const l=get(d.open);navigator.clipboard.writeText(dm(l));window.open(ctUrl(l),'_blank','noopener');e.target.textContent='Opened + copied ✓'}
  if(d.openu){navigator.clipboard.writeText(dm(get(d.id)));window.open(d.openu,'_blank','noopener');e.target.textContent='Opened + copied ✓'}
  if(d.ep){window.open(get(d.ep).episode,'_blank','noopener')}
  if(d.next){markSent(get(d.next));todayV.cur=null;save();todayV()}
  if(d.cns){markContacted(get(d.cns));todayV.cur=null;save();todayV()}
  if(d.shuf){const l=get(d.shuf);l.spin=(l.spin||0)+1;save();todayV()}
  if(d.prep)prepareClips(5,false);if(d.revealclip){const l=get(d.revealclip);fetch(RUNNER+'/reveal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:l.clipFile})}).catch(()=>alert('Start the helper first: python3 tools/local_runner.py'))}
  if(d.cplink){navigator.clipboard.writeText(get(d.cplink).clipLink);e.target.textContent='Copied ✓'}
  if(d.ed)editLead(d.ed);if(d.edc)editLead(d.edc,'contact');if(d.ede)editLead(d.ede,'episode');if(d.gc)sendToClipper(d.gc);if(d.reveal)revealSample(d.reveal);
  if(d.rm){get(d.rm).status='Removed';todayV.cur=null;save();todayV()}
  if(d.skip){todayV.skip.add(d.skip);todayV.skipOrder.push(d.skip);todayV.cur=null;todayV()}
  if(d.undo)undoSent();
  if(d.back){const id=todayV.skipOrder.pop();if(id){todayV.skip.delete(id);todayV.cur=id}todayV()}};
 $('#main').onchange=e=>{const id=e.target.dataset.sent;if(id&&e.target.checked){markSent(S.leads.find(x=>x.id==id));save();e.target.closest('tr').style.opacity=.4;$('.card b').textContent=sentOn(today())+'/'+S.settings.daily}}}
function normSocial(v,base){v=(v||'').trim();if(!v)return '';if(/^https?:\/\//i.test(v))return v.replace(/\/+$/,'');v=v.replace(/^@/,'').replace(/\s+/g,'');return v?base+v:''}
function normEpisode(v){v=(v||'').trim();if(!v)return '';let m=v.match(/[?&]v=([\w-]{11})/)||v.match(/youtu\.be\/([\w-]{11})/)||v.match(/youtube\.com\/(?:shorts|live|embed)\/([\w-]{11})/)||v.match(/^([\w-]{11})$/);return m?'https://www.youtube.com/watch?v='+m[1]:v}
function normChannel(v){v=(v||'').trim();if(!v)return '';if(/^UC[\w-]{20,}$/.test(v))return 'https://www.youtube.com/channel/'+v;if(/^@[\w.-]+$/.test(v))return 'https://www.youtube.com/'+v;return v}
function applyEdit(l,v){const has=k=>Object.prototype.hasOwnProperty.call(v,k);
 if(has('name')&&(v.name||'').trim())l.name=v.name.trim();if(has('niche'))l.niche=(v.niche||'').trim();if(has('url'))l.url=normChannel(v.url);if(has('episode'))l.episode=normEpisode(v.episode);if(has('epTitle'))l.epTitle=(v.epTitle||'').trim();
 if(has('ig'))l.ig=normSocial(v.ig,'https://instagram.com/');if(has('x'))l.x=normSocial(v.x,'https://x.com/');if(has('tt'))l.tt=normSocial(v.tt,'https://tiktok.com/@');if(has('web'))l.web=(v.web||'').trim();if(has('email'))l.email=(v.email||'').trim().toLowerCase();if(has('notes'))l.notes=(v.notes||'').trim();return l}

  ${f('email','Email')}${f('ig','Instagram (@handle or link)')}${f('x','X / Twitter (@handle or link)')}${f('tt','TikTok (@handle or link)')}${f('web','Website / link in bio')}${f('notes','Notes')}`}
 ov.className='ov';ov.innerHTML=`<div class="card"><b>${title}</b> <span class=mut>${esc(l.name)}. Handles like @name are fine.</span>${body}

const toSecs=t=>t.split(':').reduce((a,x)=>a*60+(+x||0),0),fmtSecs=n=>{const h=Math.floor(n/3600),m=Math.floor(n%3600/60),sec=n%60,p=x=>String(x).padStart(2,'0');return h?`${h}:${p(m)}:${p(sec)}`:`${m}:${p(sec)}`};
function sendToClipper(id){const l=S.leads.find(x=>x.id==id);if(!l)return;if(!l.episode)return alert('This lead has no episode link yet. Use Edit episode first.');const ov=$('#ov');

 <div class="row"><div><label>Start (mm:ss)</label><input id="gs" value="${esc(l.clipStart||'10:00')}" style="width:110px"></div><div><label>End (mm:ss)</label><input id="ge" value="${esc(l.clipEnd||'15:00')}" style="width:110px"></div><span class=mut id="glen"></span></div>
 <label>Template name</label><input id="gn2" value="${esc('Sample '+l.name)}">
 <div class="row" style="margin-top:12px"><button class="b p" id="gsend">Download and send</button><button class="b" id="gclose">Close</button><a id="gopen" target=_blank rel=noopener href="${esc(l.episode)}">Open episode at the start time</a></div><pre id="glog" style="margin-top:8px">Ready.</pre><div id="glink"></div></div>`;
 const glog=t=>{const p=document.getElementById('glog');if(p){p.textContent+='\n'+t;p.scrollTop=1e9}};
 $('#gclose').onclick=()=>{ov.className='hide';ov.innerHTML=''};
 const re2=/^\d{1,2}(:\d{2}){1,2}$/,refresh=()=>{const a=$('#gs').value.trim(),b=$('#ge').value.trim(),len=document.getElementById('glen'),op=document.getElementById('gopen');
  if(re2.test(a)){op.href=l.episode+(l.episode.includes('?')?'&':'?')+'t='+toSecs(a)+'s'}
  if(re2.test(a)&&re2.test(b)){const d=toSecs(b)-toSecs(a);len.textContent=d>0?`Length: ${fmtSecs(d)}`:'End must be after start'}else len.textContent=''};
 $('#gs').oninput=refresh;$('#ge').oninput=refresh;refresh();
 $('#gsend').onclick=async()=>{const st=$('#gs').value.trim(),end=$('#ge').value.trim();if(!re2.test(st)||!re2.test(end))return glog('Start and end must look like 12:00');
  const dur=toSecs(end)-toSecs(st);if(dur<=0)return glog('End must be after start.');if(dur>1800&&!confirm('That is '+fmtSecs(dur)+' long, which is a big download. Continue?'))return;
  l.clipStart=st;l.clipEnd=end;save();$('#glog').textContent='';
  let r;try{r=await (await fetch(RUNNER+'/clipper/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:l.episode,start:st,end,name:$('#gn2').value.trim(),folder:'Podcast Outreach'})})).json()}
  catch(e){return glog('Helper not running. In Terminal: cd ~/clipper-crm && python3 tools/local_runner.py')}
  if(r.error)return glog('Could not start: '+r.error);
  $('#gsend').disabled=true;let since=0,go=true;
  while(go&&document.getElementById('glog')){await new Promise(x=>setTimeout(x,2000));try{const j=await (await fetch(RUNNER+'/log?since='+since)).json();since=j.next;j.lines.forEach(t=>{if(t.startsWith('RESULT ')){try{const r=JSON.parse(t.slice(7));Object.assign(l,{sampleSlug:r.slug,sampleName:r.name,sampleFile:r.video,sampleDir:r.dir});save();glog('Saved to this lead: '+r.dir)}catch(e){}}else glog(t)});go=j.running}catch(e){glog('Lost contact with the helper.');go=false}}
  pollClipper();const url=(pollClipper.last&&pollClipper.last.url)||'http://127.0.0.1:5001';const gl=document.getElementById('glink');if(gl)gl.innerHTML=`<a target=_blank rel=noopener href="${esc(url)}">Open the clipper</a>${l.sampleFile?` · <button class="b" data-reveal="${esc(l.id)}">Show file</button>`:''}`;if(gl)gl.onclick=e=>{if(e.target.dataset.reveal)revealSample(l.id)};const b=document.getElementById('gsend');if(b)b.disabled=false}}
async function revealSample(id){const l=S.leads.find(x=>x.id==id);if(!l||!l.sampleFile)return alert('No sample file saved for this lead yet.');
 try{const r=await (await fetch(RUNNER+'/reveal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:l.sampleFile})})).json();if(r.error)alert(r.error)}catch(e){alert('Start the helper first: python3 tools/local_runner.py')}}
const normName=n=>String(n||'').toLowerCase().replace(/^sample\s+/,'').replace(/[^a-z0-9]+/g,' ').trim();
async function matchSamples(){let j;try{j=await (await fetch(RUNNER+'/clipper/templates')).json()}catch(e){return alert('Start the helper first: python3 tools/local_runner.py')}
 if(j.error)return alert('The clipper app is off, so I cannot read its templates.');let n=0;const lines=[];
 for(const t of j.templates){const tn=normName(t.name);if(!tn)continue;const hit=S.leads.find(l=>{const ln=normName(l.name);return ln&&(ln===tn||ln.includes(tn)||tn.includes(ln))});
  if(hit){Object.assign(hit,{sampleSlug:t.slug,sampleName:t.name,sampleFile:t.video_path,sampleDir:t.dir});n++;lines.push(`${t.name}  ->  ${hit.name}`)}else lines.push(`${t.name}  ->  no matching lead`)}
 save();alert(`Matched ${n} of ${j.templates.length} samples in "${j.folder}".\n\n`+lines.join('\n'));render()}
function markContacted(l){(S.undo=S.undo||[]).push({id:l.id,status:l.status,sent:l.sent||'',follow:l.follow||'',contacted:l.contacted||'',at:Date.now()});S.undo=S.undo.slice(-30);l.status=CNS;l.contacted=today()}
function undoSent(){const u=(S.undo||[]).pop();if(!u)return;const l=S.leads.find(x=>x.id==u.id);if(l){l.status=u.status||'New';l.sent=u.sent;l.follow=u.follow;l.contacted=u.contacted||''}todayV.cur=u.id;save();render()}
function pinLead(id){const l=S.leads.find(x=>x.id==id);if(!l)return false;
 if(l.status!='New'){l.status='New';l.sent='';l.follow='';l.contacted=''}
 l.pin=Date.now();todayV.cur=l.id;if(todayV.skip)todayV.skip.delete(l.id);todayV.skipOrder=(todayV.skipOrder||[]).filter(x=>x!=l.id);
 save();tab='today';render();return true}
/* ---------------- Email: find contact emails, prepare clips, preview, drafts, send, follow-ups, replies ---------------- */
const ES={lines:[],busy:false,preview:null,status:null,msg:''};
const DAY=86400000;
const isSuppressed=e=>{const L=(ES.status&&ES.status.suppressed_list)||[],a=String(e||'').toLowerCase();return L.includes(a)||L.includes('@'+a.split('@')[1])};
const isEmailReady=l=>l.status=='New'&&l.email&&l.clipLink&&!l.emailedAt&&!isSuppressed(l.email);
const ytLeads=l=>/youtube\.com|youtu\.be/.test(l.episode||'');
function emailFunnel(){const L=S.leads.filter(l=>l.status!='Removed'),now=Date.now();
 const emailed=L.filter(l=>l.emailedAt);
 return{fresh:L.filter(l=>l.status=='New').length,withEmail:L.filter(l=>l.status=='New'&&l.email).length,withClip:L.filter(l=>l.status=='New'&&l.email&&l.clipLink).length,
  ready:L.filter(isEmailReady).length,emailed:emailed.length,replied:L.filter(l=>l.emailedAt&&['Replied','Interested','Client'].includes(l.status)).length,
  followDue:emailed.filter(l=>l.status=='Sample Sent'&&(l.emailStep||0)<2&&now-(l.firstEmailedAt||l.emailedAt)>=(((l.emailStep||0)==0?3:7)*DAY)-3600000).length}}
async function helperJob(path,body,onLine){
 ES.lines=[];ES.busy=true;ES.msg='';emailDyn();
 let r;try{r=await (await fetch(RUNNER+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json()}
 catch(e){ES.busy=false;ES.msg='Helper not running. In Terminal: cd ~/clipper-crm && python3 tools/local_runner.py';emailDyn();return false}
 if(r.error){ES.busy=false;ES.msg=r.error;emailDyn();return false}
 let since=0,go=true;while(go){await new Promise(x=>setTimeout(x,2000));
  try{const j=await (await fetch(RUNNER+'/log?since='+since)).json();since=j.next;j.lines.forEach(t=>{ES.lines.push(t);onLine&&onLine(t)});go=j.running;save();emailDyn();if(tab=='today')todayV()}catch(e){ES.msg='Lost contact with the helper.';go=false}}
 ES.busy=false;save();emailDyn();if(tab=='today')todayV();return true}
const parseTag=(t,tag)=>t.startsWith(tag+' ')?JSON.parse(t.slice(tag.length+1)):null;
function findEmails(n){const now=Date.now();
 const todo=S.leads.filter(l=>l.status=='New'&&!l.email&&l.name&&!(l.emailChecked&&now-l.emailChecked<14*DAY)).slice(0,n).map(l=>({id:l.id,name:l.name,url:l.url,web:l.web}));
 if(!todo.length){ES.msg='Every fresh lead already has an email, or was checked in the last 14 days.';return emailDyn()}
 return helperJob('/emails/find',{leads:todo},t=>{let r;
  if(r=parseTag(t,'EMAILFOUND')){const l=S.leads.find(x=>x.id==r.id);if(l){l.email=r.email;l.emailSource=r.source;l.emailChecked=Date.now()}}
  else if(r=parseTag(t,'EMAILNONE')){const l=S.leads.find(x=>x.id==r.id);if(l)l.emailChecked=Date.now()}})}
function prepareClips(n,onlyWithEmail){
 const todo=S.leads.filter(l=>l.status=='New'&&!l.clipLink&&ytLeads(l)&&(!onlyWithEmail||l.email)).slice(0,n).map(l=>({id:l.id,name:l.name,url:l.episode,epTitle:l.epTitle}));
 if(!todo.length){ES.msg=onlyWithEmail?'No leads with an email still need a clip. Find emails first, or untick the box.':'No leads need a clip.';return emailDyn()}
 return helperJob('/pipeline/start',{leads:todo,minutes:5,clips:1},t=>{let r;
  if(r=parseTag(t,'PERSONAL')){const l=S.leads.find(x=>x.id==r.id);if(l)l.personalLine=r.line||''}
  if(r=parseTag(t,'PIPE')){const l=S.leads.find(x=>x.id==r.id);if(l)Object.assign(l,{clipLink:r.link,clipFile:r.clip,clipTitle:r.title,clipHook:r.hook||'',personalLine:r.personal||'',sampleSlug:r.slug,sampleName:r.name,sampleFile:r.video,sampleDir:r.dir,clipFail:''})}

function applyEmailResult(r){const l=S.leads.find(x=>x.id==r.id);if(!l)return;
 if(r.status=='sent'){if((r.step||0)==0){markSent(l);l.firstEmailedAt=Date.now()}l.emailedAt=Date.now();l.emailStep=r.step||0;l.emailSubject=l.emailSubject||r.subject;l.emailFrom=r.from;l.via='email'}

async function sendEmails(mode,step){const n=+S.settings.emailLimit||20;let leads;
 if(step>0){const now=Date.now();leads=S.leads.filter(l=>l.emailedAt&&l.status=='Sample Sent'&&(l.emailStep||0)==step-1&&now-(l.firstEmailedAt||l.emailedAt)>=((step==1?3:7)*DAY)-3600000).slice(0,n).map(emailPayload)}

async function writePersonal(){const todo=S.leads.filter(l=>l.clipFile&&!l.personalLine&&l.status=='New'&&l.email).slice(0,20).map(l=>({id:l.id,name:l.name,epTitle:l.epTitle,clipFile:l.clipFile,clipTitle:l.clipTitle,clipHook:l.clipHook}));

async function loadEmailStats(){const el=document.getElementById('email-stats');if(!el)return;let st;try{st=await (await fetch(RUNNER+'/email/stats',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})).json()}catch(e){el.innerHTML='';return}

function emailDyn(){const el=document.getElementById('email-dyn');if(!el)return;const f=emailFunnel(),st=ES.status,dis=ES.busy?'disabled':'',canSend=st&&st.ready&&!ES.busy?'':'disabled';
 const bar=(k,v)=>`<div class="stat"><small>${k}</small><b>${v}</b></div>`;

async function yt(path,p){if(!S.settings.key)throw new Error('Add your YouTube API key in Settings first.');

function socials(t){const o={ig:'',x:'',tt:'',web:''};let m;t=t||'';
 const igBad=/^(p|reel|reels|explore|accounts|stories|tv|youtube|about|direct)$/i,xBad=/^(intent|share|i|home|search|hashtag|youtube|login|signup|settings|privacy|tos|explore)$/i;

 const x=/(?:twitter|x)\.com\/([A-Za-z0-9_]{1,15})(?![A-Za-z0-9_])/ig;while((m=x.exec(t)))if(!xBad.test(m[1])){o.x='https://x.com/'+m[1];break}
 if((m=/tiktok\.com\/@([A-Za-z0-9._]{2,30})/i.exec(t)))o.tt='https://tiktok.com/@'+m[1];
 const bio=/https?:\/\/(?:www\.)?(?:linktr\.ee|beacons\.ai|stan\.store|bio\.link|linkin\.bio|lnk\.bio|campsite\.bio|solo\.to|carrd\.co)\/[^\s"'<>]+/i.exec(t);
 const any=/https?:\/\/(?:www\.)?(?!(?:[a-z0-9.-]*)(?:youtube|youtu\.be|instagram|twitter|x\.com|tiktok|facebook|spotify|apple|google|amazon|patreon))[a-z0-9.-]+\.[a-z]{2,}[^\s"'<>]*/i.exec(t);
 const b=bio||any;if(b)o.web=b[0].replace(/[),.]+$/,'');return o}
function isoSecs(d){const m=/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(d||'');return m?(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0):0}
async function pickEpisode(uploads){const pl=await yt('playlistItems',{part:'contentDetails',playlistId:uploads,maxResults:30});const items=pl.items||[];if(!items.length)return null;
 const ids=items.map(i=>i.contentDetails.videoId);const v=await yt('videos',{part:'contentDetails,snippet',id:ids.join(','),maxResults:50});
 const byId=Object.fromEntries((v.items||[]).map(x=>[x.id,x]));const newest=items[0].contentDetails.videoPublishedAt.slice(0,10);
 let shorts=0,total=0;for(const id of ids){const x=byId[id];if(!x)continue;total++;if(isoSecs(x.contentDetails.duration)<=180||/#shorts?\b/i.test(x.snippet.title+' '+(x.snippet.description||'').slice(0,300)))shorts++}
 let pick=null;for(const id of ids){const x=byId[id];if(x){const d=isoSecs(x.contentDetails.duration);if(d>=1200&&d<=14400){pick=x;break}}}
 if(!pick){let best=0;for(const id of ids){const x=byId[id];const d=x?isoSecs(x.contentDetails.duration):0;if(d>best){best=d;pick=x}}}
 return{newest,id:pick?pick.id:ids[0],title:pick?pick.snippet.title:'',shorts,total,pct:total?Math.round(100*shorts/total):null}}

async function addChannels(c,log,force){const g=S.settings,have=new Set(S.leads.map(l=>l.id));let added=0;skipped=0;dups=0;shortsSk=0;const sk=seenKeys();

    ig:s.ig||(k.aiIg?'https://instagram.com/'+k.aiIg:''),x:s.x||k.aiX||'',tt:s.tt||k.aiTt||'',web:s.web||k.aiWeb||'',status:'New',added:today(),sent:'',follow:'',notes:[s.ig?'':(k.aiIg?'IG from Gemini, verify':''),k.aiNote||''].filter(Boolean).join(' | ')});added++}
  save();log(`  checked ${Math.min(i+50,c.length)}/${c.length} channels…`)}return added}

async function geminiCall(prompt,useSearch,log){const g=S.settings;log=log||(()=>{});if(!g.geminiKey)throw new Error('Add your Gemini API key in Settings first.');

 for(let i=0;i<models.length&&i<6;i++){const model=models[i];
  for(const tools of useSearch?[true,false]:[false]){
   const body={contents:[{parts:[{text:prompt}]}]};if(tools)body.tools=[{google_search:{}}];
   let j;try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':g.geminiKey},body:JSON.stringify(body)});j=await r.json()}

    if(/API key|API_KEY|PERMISSION_DENIED|not valid/i.test(m+(j.error.status||'')))throw new Error('Gemini rejected your key ('+m+'). Make a new one at aistudio.google.com/apikey and paste it in Settings.');

   if(model!==g.geminiModel){g.geminiModel=model;save()}
   if(useSearch&&!tools)log('  (this answer is NOT web grounded, so verify links)');
   return t}
  if(i==models.length-1&&!discovered){discovered=true;try{(await geminiModels()).forEach(m=>{if(!models.includes(m))models.push(m)})}catch(e){lastErr+=' | model list: '+e.message}}}
 throw new Error('Gemini failed. Last error: '+lastErr)}
function jsonList(t){const m=t.match(/\[[\s\S]*\]/);if(!m)throw new Error('Gemini did not return a list. Try again or lower the count.');
 try{return JSON.parse(m[0])}catch(e){return JSON.parse(m[0].replace(/,\s*([\]}])/g,'$1'))}}
async function askGemini(niche,count,extra,log){return jsonList(await geminiCall(episodePrompt(niche,count,extra,true),true,log))}
async function resolveAI(it){let m;const eu=it.episode_url||'',u=it.youtube_url||'';
 if((m=eu.match(/[?&]v=([\w-]{11})/)||eu.match(/youtu\.be\/([\w-]{11})/)||u.match(/[?&]v=([\w-]{11})/))){const v=await yt('videos',{part:'snippet',id:m[1]});if(v.items?.[0])return{id:v.items[0].snippet.channelId,video:m[1],epTitle:v.items[0].snippet.title}}
 if((m=u.match(/youtube\.com\/channel\/(UC[\w-]{20,})/)))return{id:m[1]};
 if((m=u.match(/youtube\.com\/(@[\w.-]+)/))){const j=await yt('channels',{part:'id',forHandle:m[1]});if(j.items?.[0])return{id:j.items[0].id}}
 if(!it.name)return null;const j=await yt('search',{part:'snippet',type:'channel',q:it.name+' podcast',maxResults:1});const x=j.items?.[0];return x?{id:x.snippet.channelId||x.id.channelId}:null}
async function geminiParse(text,log){
 const prompt='Extract every podcast mentioned in the text below. Return ONLY a JSON array. Each item: {"name":"","youtube_url":"channel link","episode_url":"direct watch link of a specific episode","episode_title":"","clip_idea":"","instagram_handle":"","x_url":"","tiktok_url":"","website":""}. Use only information present in the text; leave a field empty if absent; never invent handles or URLs.\n\nTEXT:\n'+text.slice(0,30000);
 return jsonList(await geminiCall(prompt,false,log))}
function blockItem(b,nameOverride){const o={name:'',youtube_url:'',episode_url:'',episode_title:'',clip_idea:'',instagram_handle:'',x_url:'',tiktok_url:'',website:''};let m;
 const bold=/\*\*([^*]{2,80})\*\*/.exec(b);
 o.name=(nameOverride||(bold?bold[1]:b.split('\n')[0])).replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/[*_#`>\[\]]/g,'').replace(/^\s*[-*•]\s+/,'').replace(/^\d+[.)]\s*/,'').replace(/^[\s:–—-]+/,'').split(/\s[–—-]\s|:\s|\s\(|https?:/)[0].slice(0,70).trim();
 if((m=/https?:\/\/(?:www\.)?youtube\.com\/(?:channel\/UC[\w-]{20,}|@[\w.-]+)/i.exec(b)))o.youtube_url=m[0];
 if((m=/https?:\/\/(?:www\.)?youtube\.com\/watch\?v=[\w-]{11}/i.exec(b)))o.episode_url=m[0];else if((m=/https?:\/\/youtu\.be\/[\w-]{11}/i.exec(b)))o.episode_url=m[0].replace('youtu.be/','www.youtube.com/watch?v=');
 const so=socials(b),bad=/^(unknown|n\/a|none|na|not|no)$/i;
 if(so.ig)o.instagram_handle=so.ig.split('/').pop();
 else if((m=/(?:instagram|insta|\big\b)[^@\n]{0,25}@([A-Za-z0-9._]{2,30})/i.exec(b))||(m=/^\s*[-*•]?\s*(?:instagram|ig)[^:\n]*:\s*@?([A-Za-z0-9._]{2,30})\s*$/im.exec(b)))if(!bad.test(m[1]))o.instagram_handle=m[1];
 o.x_url=so.x;if(!o.x_url&&(m=/^\s*[-*•]?\s*(?:x|twitter)[^:\n]*:\s*@?([A-Za-z0-9_]{1,15})\s*$/im.exec(b))&&!bad.test(m[1]))o.x_url='https://x.com/'+m[1];
 o.tiktok_url=so.tt;if(!o.tiktok_url&&(m=/^\s*[-*•]?\s*tiktok[^:\n]*:\s*@?([A-Za-z0-9._]{2,30})\s*$/im.exec(b))&&!bad.test(m[1]))o.tiktok_url='https://tiktok.com/@'+m[1];
 o.website=so.web;
 return o.name&&(o.youtube_url||o.episode_url||o.instagram_handle||o.x_url||o.tiktok_url||o.website)?o:null}
function tableParse(text){const rows=text.split('\n').map(l=>l.trim()).filter(l=>l.startsWith('|')&&!/^\|[\s:|-]+\|?$/.test(l));if(rows.length<2)return null;
 const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()),head=cells(rows[0]).map(h=>h.toLowerCase().replace(/[*_]/g,''));
 const col=(re,not)=>head.findIndex(h=>re.test(h)&&!(not&&not.test(h)));const ni=Math.max(0,col(/podcast|show|name/,/episode/)),ei=col(/episode|title/,/link|url/),ci=col(/clip|moment|idea|why/);
 const out=[];for(const r of rows.slice(1)){const c=cells(r),clean=v=>(v||'').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/[*_`]/g,'').trim();
  const it=blockItem(c.map((v,i)=>(head[i]||'col')+': '+v).join('\n'),clean(c[ni]));if(!it)continue;
  if(ei>=0&&c[ei]&&!/^https?:/i.test(clean(c[ei])))it.episode_title=clean(c[ei]);if(ci>=0&&c[ci])it.clip_idea=clean(c[ci]);out.push(it)}return out}
function basicParse(text){const tp=tableParse(text);if(tp&&tp.length)return tp;
 const out=[],sig=/youtube\.com|youtu\.be|instagram|@|https?:/i,st=l=>/^\s*(?:\d+[.)]\s|#{1,4}\s)/.test(l)||/^\s*\*\*[^*]+\*\*\s*:?\s*$/.test(l)||/^\s*[-*•]\s+.*\*\*[^*]+\*\*/.test(l);let cur=[];
 const flush=()=>{if(cur.length)out.push(cur.join('\n'));cur=[]};
 for(const l of text.split('\n')){if(!l.trim()){if(sig.test(cur.join('\n')))flush();continue}if(st(l)&&sig.test(cur.join('\n')))flush();cur.push(l)}flush();
 return out.map(b=>blockItem(b.trim())).filter(Boolean)}
async function ingestPasted(text,niche,log){let items=null;

 if(!items)items=basicParse(text);log(`Found ${items.length} podcast(s) in the text.`);
 const cands=[],have=new Set(S.leads.map(l=>l.id));let direct=0;skipped=0;
 for(const it of items){const ig=(it.instagram_handle||'').replace(/^@/,'').replace(/[^A-Za-z0-9._]/g,'');let rr=null;
  try{rr=await resolveAI(it)}catch(e){log('  YouTube lookup failed for '+it.name+': '+e.message)}
  if(rr)cands.push({...rr,niche,aiNote:it.clip_idea?'Clip idea: '+it.clip_idea:'',aiIg:ig,aiX:it.x_url||'',aiTt:it.tiktok_url||'',aiWeb:it.website||''});

   S.leads.push({id:lid,name:it.name,niche,url:it.youtube_url||'',subs:0,last:'',episode:it.episode_url||'',epTitle:it.episode_title||'',ig:ig?'https://instagram.com/'+ig:'',x:it.x_url||'',tt:it.tiktok_url||'',web:it.website||'',status:'New',added:today(),sent:'',follow:'',notes:(it.episode_url?'':'No YouTube channel found, find an episode to clip')+(it.clip_idea?(it.episode_url?'':' | ')+'Clip idea: '+it.clip_idea:'')});direct++;log('  added without YouTube: '+it.name)}}

async function findInstagrams(list){let found=0;
 for(let i=0;i<list.length;i+=10){const grp=list.slice(i,i+10);
  const prompt='Use Google Search. For each podcast below, find the official Instagram handle of the show or its host. Return ONLY a JSON array like [{"i":0,"instagram_handle":""}]. Leave instagram_handle empty if you are not sure. Never guess.\n'+grp.map((l,k)=>`${k}. ${l.name} (YouTube: ${l.url}${l.niche?', niche: '+l.niche:''})`).join('\n');
  let arr;try{arr=jsonList(await geminiCall(prompt,true))}catch(e){if(/key|Gemini failed/i.test(e.message))throw e;continue}
  for(const a of arr){const l=grp[a.i];const h=(a.instagram_handle||'').replace(/^@/,'').replace(/[^A-Za-z0-9._]/g,'');if(l&&h){l.ig='https://instagram.com/'+h;l.notes=(l.notes?l.notes+' | ':'')+'IG from Gemini, verify';found++}}}

 $('#main').onclick=e=>{if(e.target.dataset.dp){S.payments.splice(e.target.dataset.dp,1);save();moneyV()}if(e.target.dataset.dt){S.team.splice(e.target.dataset.dt,1);save();moneyV()}if(e.target.dataset.rd!=null){RS.splice(+e.target.dataset.rd,1);save();moneyV()}}}
function settings(){const g=S.settings,f=(k,l,t='number')=>`<div><label>${l}</label><input data-k="${k}" type="${t}" value="${esc(g[k])}"></div>`;
 $('#main').innerHTML=`<div class="card"><div class="grid">${f('key','YouTube API key','password')}${f('goal','Monthly goal ($)')}${f('daily','Daily outreach goal')}${f('minSubs','Min subscribers')}${f('maxSubs','Max subscribers')}${f('maxDays','Max days since last upload')}${f('followDays','Follow-up days')}${f('templates','Queries per niche (1-4)')}${f('geminiKey','Gemini API key (aistudio.google.com/apikey)','password')}${f('geminiModel','Gemini model','text')}<div><label>Skip podcasts with no contact info (1 = yes, 0 = no)</label><input data-k="skipNoContact" type="number" min="0" max="1" value="${esc(g.skipNoContact)}"></div><div><label>Use Gemini to structure pasted text (1 = yes, 0 = built in parser, free)</label><input data-k="useGeminiParse" type="number" min="0" max="1" value="${esc(g.useGeminiParse)}"></div><div><label>Max % Shorts in recent uploads (0 to 100, 100 = no filter)</label><input data-k="maxShorts" type="number" min="0" max="100" value="${esc(g.maxShorts)}"></div><div><label>Instagram only (1 = only queue leads with an Instagram, 0 = Instagram first, then X / TikTok / link)</label><input data-k="igOnly" type="number" min="0" max="1" value="${esc(g.igOnly)}"></div></div>
 <h4>Google Sheet sync (so your bot sees your numbers)</h4><div class="grid">${f('syncUrl','Web app URL (…/exec)','text')}${f('syncPw','Sync password','password')}</div>
 <div class="row"><button class="b" id="tg">Test Gemini</button><button class="b p" id="sn">Sync now</button><button class="b" id="pl">Pull from Sheet (replaces local data)</button></div>
 <label>DM template: {name} {niche} {episode}. Spintax like {Hey|Hi|Hey there} picks one per lead. Dashes are removed automatically</label><textarea data-k="dm">${esc(g.dm)}</textarea></div>
 <div class="card"><b>Backup</b><p class=mut>Your data lives in this browser only. Export regularly (or before clearing browser data) and import on another device.</p>
 <div class="row"><button class="b p" id="ex">Export JSON</button><input type="file" id="im" accept=".json"></div></div>`;
 $('#main').oninput=e=>{const k=e.target.dataset.k;if(!k)return;g[k]=e.target.type=='number'?+e.target.value:e.target.value;save()};
 $('#tg').onclick=async()=>{$('#tg').textContent='Testing…';const out=[];try{const t=await geminiCall('Use Google Search. Reply with exactly: OK and today\'s date.',true,m=>out.push(m.trim()));out.push('Reply: '+t.slice(0,80).replace(/\n/g,' '));out.push('Model in use: '+S.settings.geminiModel)}catch(e){out.push('FAILED: '+e.message)}alert(out.join('\n'));$('#tg').textContent='Test Gemini'};
 $('#sn').onclick=()=>syncCall('push');
 $('#pl').onclick=async()=>{if(!confirm('Replace local leads/payments with the Sheet data?'))return;const j=await syncCall('pull');if(j){Object.assign(S,j.state);localStorage.setItem('clipperCRM',JSON.stringify(S));render()}};
 $('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='clipper-crm-'+today()+'.json';a.click()};
 $('#im').onchange=async e=>{try{S=Object.assign({},DEF,JSON.parse(await e.target.files[0].text()));save();alert('Imported.');render()}catch(x){alert('Bad file')}}}
setInterval(()=>$('#clock').textContent=new Date().toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'}),1000);
async function mergePull(){if(!S.settings.syncUrl||!S.settings.syncPw)return;const j=await syncCall('pull');if(!j)return;
 const have=new Set(S.leads.map(l=>l.id));let n=0;for(const l of j.state.leads||[]){if(!have.has(l.id)){S.leads.push(l);have.add(l.id);n++}}
 if(n){save();render();setSync(`Merged ${n} new lead(s) from the Sheet`)}else setSync('Synced ✓ (up to date)')}
render();setSync(S.settings.syncUrl?'Sync on':'');mergePull();pollClipper();setInterval(pollClipper,6000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)mergePull()});
</script>
</body>
</html>
